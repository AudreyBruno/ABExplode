name: Build

# Compila a solution em Windows e Linux a cada push e pull request (não publica nada; a release é o publicar.yml).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (app WPF + projetos da migração, os dois alvos do app Avalonia)
        run: dotnet build ABExplode.sln -c Release -nologo

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # O app WPF só compila no Windows; aqui vai o app Avalonia no alvo Linux (puxa Core, Platform e Platform.Linux)
      - name: Build (app Avalonia, alvo Linux)
        run: dotnet build src/ABExplode.App/ABExplode.App.csproj -c Release -f net8.0 -nologo

      - name: Publish de teste (linux-x64)
        run: dotnet publish src/ABExplode.App/ABExplode.App.csproj -c Release -f net8.0 -r linux-x64 --self-contained true -o dist-linux -nologo
